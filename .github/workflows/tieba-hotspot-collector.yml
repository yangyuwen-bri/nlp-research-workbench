name: Tieba Hotspot Collector

on:
  workflow_dispatch:
  schedule:
    # 09:20 Asia/Shanghai = 01:20 UTC
    - cron: '20 1 * * *'
  pull_request:
    paths:
      - 'collectors/tieba/**'
      - '.github/workflows/tieba-hotspot-collector.yml'
  push:
    branches: [main]
    paths:
      - 'collectors/tieba/**'
      - '.github/workflows/tieba-hotspot-collector.yml'

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile collectors/tieba/tieba_collector.py collectors/tieba/run_daily.py
      - name: Tieba network smoke test
        continue-on-error: true
        run: |
          python collectors/tieba/tieba_collector.py \
            --thread 11063972585 \
            --max-pages 1 \
            --no-subposts \
            --sleep 1.5 \
            --db /tmp/tieba.sqlite3 \
            --export-dir /tmp/tieba-export

  daily-collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect latest Hot News Radar Tieba hotspots
        env:
          TIEBA_COOKIE: ${{ secrets.TIEBA_COOKIE }}
        run: python collectors/tieba/run_daily.py
      - name: Package data
        if: always()
        run: |
          cd collectors/tieba
          tar -czf tieba-data-${{ github.run_id }}.tar.gz data || true
      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tieba-data-${{ github.run_id }}
          path: collectors/tieba/tieba-data-${{ github.run_id }}.tar.gz
          retention-days: 30
